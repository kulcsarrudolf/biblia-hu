name: Release

# Publishing happens only from the release branch, never from main. Rebase
# release onto main once the version bump is committed, push, and this runs.
on:
  push:
    branches:
      - release

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    # Git hooks are for humans writing commits, not for CI, so Husky does not
    # get installed here.
    env:
      HUSKY: 0
    permissions:
      # Lets the job push the tags that changeset publish creates.
      contents: write
      # Lets the workflow request an OIDC token, which npm exchanges for a
      # short-lived publish credential. This is what replaces NPM_TOKEN.
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Changesets reads the tags and history to work out what to release.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Required for trusted publishing. Without registry-url the OIDC
          # exchange never happens and npm falls back to token auth.
          registry-url: "https://registry.npmjs.org"

      - name: Enable Corepack
        run: corepack enable

      # Node 22 ships an npm older than 11.5.1, which is the first version that
      # understands trusted publishing. changeset publish shells out to npm, so
      # it is npm's version that matters here, not Yarn's.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install dependencies
        run: yarn install --immutable

      # A publish cannot be taken back, so the suite gates it rather than
      # running beside it.
      - name: Verify
        run: |
          yarn lint
          yarn format:check
          yarn coverage
          yarn validate

      # changeset publish is a no-op for versions already on the registry, so
      # re-running this workflow is safe.
      - name: Publish to npm
        run: yarn release

      - name: Push release tags
        run: git push origin --tags
